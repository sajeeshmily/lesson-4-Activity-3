<!DOCTYPE html>
<html>

<head>
    <title>Underwater Party</title>
</head>

<body>

    <center>

        <h1>Welcome to the Underwater Party! </h1>

        <p>Enjoy ocean music and watch beautiful sea animals swim!</p>

        <h2>Ocean Background Music</h2>

        <audio controls loop>
            <source src="music.mp3" type="audio/mpeg">
            Your browser does not support audio.
        </audio>

        <h2>Watch the Ocean Animals</h2>

        <video width="500" height="350" controls loop poster="ocean.png">

            <source src="aqua.mp4" type="video/mp4">
            Your browser does not support video.
        </video>

        <p>Enjoy the magical world under the sea!</p>

    </center>

</body>

</html>
